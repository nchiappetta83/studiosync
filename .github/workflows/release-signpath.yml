name: Release Windows Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            sd-scheduling/package-lock.json
            sd-companion/package-lock.json

      - name: Install StudioSync dependencies
        working-directory: sd-scheduling
        run: npm ci

      - name: Install StudioSync MyTasks dependencies
        working-directory: sd-companion
        run: npm ci

      - name: Build StudioSync installer
        working-directory: sd-scheduling
        run: npm run build

      - name: Build StudioSync MyTasks installer
        working-directory: sd-companion
        run: npm run build

      - name: Package win-unpacked downloads
        shell: pwsh
        run: |
          $version = (Get-Content sd-scheduling/package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-packages | Out-Null

          Compress-Archive -Path sd-scheduling/dist/win-unpacked -DestinationPath "release-packages/StudioSync win-unpacked $version.zip" -Force
          Compress-Archive -Path sd-companion/dist/win-unpacked -DestinationPath "release-packages/StudioSync MyTasks win-unpacked $version.zip" -Force

      - name: Upload unsigned StudioSync installer
        id: upload_studiosync_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: studiosync-unsigned-installer
          path: sd-scheduling/dist/StudioSync Setup *.exe
          if-no-files-found: error

      - name: Upload unsigned StudioSync MyTasks installer
        id: upload_mytasks_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: studiosync-mytasks-unsigned-installer
          path: sd-companion/dist/StudioSync MyTasks Setup *.exe
          if-no-files-found: error

      - name: Upload StudioSync win-unpacked package
        uses: actions/upload-artifact@v4
        with:
          name: studiosync-win-unpacked-package
          path: release-packages/StudioSync win-unpacked *.zip
          if-no-files-found: error

      - name: Upload StudioSync MyTasks win-unpacked package
        uses: actions/upload-artifact@v4
        with:
          name: studiosync-mytasks-win-unpacked-package
          path: release-packages/StudioSync MyTasks win-unpacked *.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "StudioSync installers and win-unpacked download packages."
          }

          $files = @(
            Get-ChildItem -File sd-scheduling/dist/StudioSync*.exe | Select-Object -ExpandProperty FullName
            Get-ChildItem -File sd-companion/dist/StudioSync*.exe | Select-Object -ExpandProperty FullName
            Get-ChildItem -Recurse -File release-packages | Select-Object -ExpandProperty FullName
          ) | Where-Object { $_ }
          if (-not $files) {
            throw "No release files were found."
          }

          gh release upload $tag $files --clobber
